name: Mobile Automation Pipeline

# Execution is local-emulator-only for this project (see README) -- there is deliberately no
# emulator boot in CI here, unlike a cloud-device setup. Everything below runs with NO device
# attached, which is an honest scope: it proves the framework builds, its own unit tests pass,
# generated code hasn't drifted from its specs, a run's results analyze cleanly, and (new in
# this revision) that heal-rate stays within policy and results are actually visible to humans
# -- in the PR, in a published Allure report, and in Slack on failure. The device suite itself
# remains a manual dispatch lane for whoever has a self-hosted runner with a real emulator/
# device wired up.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_device_suite:
        description: "Run the full device suite (needs a self-hosted runner with an emulator/device attached)"
        type: boolean
        default: false

# A new push to the same PR/branch supersedes the old one -- no point burning minutes on a
# run whose results are already stale.
concurrency:
  group: mobile-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: ./mvnw -B compile test-compile

      - name: Framework unit tests (device-free)
        # Only the classes that need no Appium session / no emulator: spec parser, codegen,
        # fingerprint scoring, strategy cascade, test-impact selection, heal policy, data
        # cleanup. Surefire XML lands under target/surefire-reports/ -- consumed below.
        run: ./mvnw -B test -Dtest="com.azm.qa.mobile.framework.**" -DfailIfNoTests=false

      # --- Reporting addition 1: JUnit results visible on the PR itself -----------------
      # Without this, a failing unit test is a red X you have to click into logs to explain.
      # dorny/test-reporter reads the same surefire XML Maven already writes and turns it
      # into inline pass/fail annotations + a check-run summary. No new test dependency.
      - name: Publish unit test results to the PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Framework unit tests
          # Only the per-class TEST-*.xml files are JUnit-schema; surefire also writes
          # testng-results.xml / testng-failed.xml in TestNG's own schema, and the java-junit
          # parser throws (not just "no matches") if those are included in the glob --
          # confirmed directly against this repo's CI run.
          path: "target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false # this step reports; it never gates the build itself

      - name: Upload surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
          retention-days: 14

      # --- Reporting addition 5: Allure report link in the run summary -----------------
      # This job only runs device-free unit tests, so it deliberately does NOT regenerate or
      # republish gh-pages here -- that would silently overwrite the richer, manually-maintained
      # report (real device runs, real self-healing evidence) with a thinner unit-tests-only
      # one. Once device-suite actually runs on a schedule (self-hosted runner), move this link
      # to a step that generates it fresh there instead of pointing at the last manual publish.
      - name: Link the Allure report in the run summary
        if: always()
        run: |
          {
            echo "### Allure Report"
            echo ""
            echo "[View the hosted Allure report](https://azmdevelopment.github.io/M2-Zain-Hashmi-Mobile/)"
            echo ""
            echo "_Points at the last manually-published report (includes real device runs against Aptoide). Not regenerated by this job, which only runs device-free unit tests._"
          } >> "$GITHUB_STEP_SUMMARY"

  codegen-drift-check:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Each job starts from a fresh checkout with no compiled classes -- exec:java needs
      # PipelineRunner's class file to exist before it can run it. Confirmed directly: this
      # step failed with a missing-main-class error without this.
      - name: Compile
        run: ./mvnw -q -B compile

      - name: Regenerate every spec
        run: |
          for spec in specs/*.md; do
            ./mvnw -q exec:java -Dexec.args="md --file $spec"
          done

      - name: Fail if regeneration produced a diff
        # The whole point of a deterministic generator: the committed generated/ tree must be
        # exactly what running `md` against the committed specs produces right now. A diff here
        # means either a spec changed without regenerating, or the generator itself drifted.
        run: |
          git diff --exit-code -- src/test/java/com/azm/qa/mobile/generated/ \
            || (echo "::error::Generated code is out of date -- run the md command locally and commit the result" && exit 1)

  run-analysis:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Same reason as codegen-drift-check: a fresh job has no compiled classes yet. This job
      # additionally needs test-compile (not just compile): exec:java's classpathScope is
      # "test" so it can read config/config.properties, but that file only lands under
      # target/test-classes once process-test-resources/test-compile actually runs --
      # confirmed directly (compile alone left this step failing with "Missing required
      # config resource: config/config.properties").
      - name: Compile
        run: ./mvnw -q -B compile test-compile

      - name: Deterministic run analysis
        # No credentials required. Narration only appears if ANTHROPIC_API_KEY is set as a repo
        # secret -- every other line of this step's output is unaffected by whether it is.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./mvnw -q exec:java -Dexec.args="analyze"

  device-suite:
    # Manual-dispatch only (real emulator boots are slow/costly to run on every push) -- but
    # unlike the self-hosted design this replaces, this now actually executes when dispatched.
    # The self-hosted version had zero registered runners against this repo, ever -- this job
    # never ran, full stop. ubuntu-latest + reactivecircus/android-emulator-runner boots a real,
    # KVM-accelerated emulator directly on a GitHub-hosted Linux runner -- the same approach
    # already proven working in the reference repo for this same assessment.
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_suite
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    timeout-minutes: 30
    # Needed for the gh-pages push below -- confirmed directly that this repo's default
    # GITHUB_TOKEN permissions are read-only (push failed with a 403, "Write access to
    # repository not granted") without this declared explicitly.
    permissions:
      contents: write
    steps:
      # lfs: true -- apk/aptoide-cm.aptoide.pt-9.22.5.3.apk is Git-LFS-tracked; a plain
      # checkout would leave a pointer file, not the real ~20MB APK uiautomator2 needs to
      # install.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable KVM group perms (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium + uiautomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: AVD snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -memory 4096 -- see the real test-run step below for why.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: echo "AVD created and boot-cached"

      # testng.xml's Smoke/Proof blocks each pin a specific device.profile with a specific
      # udid (device-profiles.json's pixel7_api36 -> emulator-5554, pixel7_api34 ->
      # emulator-5556) for a two-emulator parallel run this single-emulator job can't provide.
      # testng-smoke.xml has no device parameter, so it attaches to whatever single device adb
      # reports -- confirmed directly against this app: this is what actually got the first
      # real device run green on a single-emulator machine.
      - name: Boot the emulator and run the real suite against Aptoide
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -memory 4096: confirmed directly that the default allocation left the emulator's own
          # SystemUI process unresponsive under load ("System UI isn't responding" ANR overlaying
          # the real, correctly-rendered onboarding screen) on a real dispatched run -- a resource
          # constraint, not a locator/framework bug (the retry fix below is the second line of
          # defense for whatever residual flake this doesn't fully eliminate).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          # reactivecircus/android-emulator-runner runs EACH LINE of `script` as its own
          # separate `sh -c` invocation, not as one cohesive multi-line script -- confirmed
          # directly: a `for ... do ... done` split across lines here failed with "Syntax
          # error: end of file unexpected (expecting done)" because only the `for` line's
          # own `sh -c` call ever saw it. Every line below is a fully self-contained one-liner.
          script: |
            nohup appium --allow-insecure=uiautomator2:adb_shell > appium.log 2>&1 &
            timeout 60 bash -c 'until curl -sf http://127.0.0.1:4723/status > /dev/null; do sleep 2; done'
            ./mvnw -B test -DsuiteFile=testng-smoke.xml -Denv=aptoide "-Dapp.path=${GITHUB_WORKSPACE}/apk/aptoide-cm.aptoide.pt-9.22.5.3.apk"

      # --- Reporting addition 2: heal-rate gate --------------------------------------
      # A self-healing framework that silently absorbs every locator break isn't
      # trustworthy -- it can hide a real regression as a "pass". `analyze` already reads
      # self-healing-data/heal-events.jsonl and applies HealPolicy's configured threshold
      # (healpolicy.maxHealRate in config.properties, not a CLI flag); this step just
      # captures its verdict for the Slack message below. The exit code is captured
      # explicitly (never relying on `set -e`/pipefail shell defaults) so this step can
      # both report the rate AND still fail the job when the gate fails.
      - name: Heal-rate policy gate
        id: heal-gate
        if: always()
        run: |
          set +e
          ./mvnw -q exec:java -Dexec.args="analyze" -Denv=aptoide | tee heal-summary.txt
          analyze_exit=${PIPESTATUS[0]}
          rate=$(grep -oE 'Heal rate [0-9]+\.[0-9]+' heal-summary.txt | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "heal_rate=${rate:-unknown}" >> "$GITHUB_OUTPUT"
          exit "$analyze_exit"

      # --- Reporting addition 3: published Allure report -----------------------------
      # Raw allure-results/ is JSON -- not human-readable without `allure serve` locally.
      # This generates the static HTML report and publishes it to GitHub Pages so a
      # reviewer gets a clickable link instead of an artifact zip to download and open.
      # Requires Pages enabled once, at Settings > Pages > Source: gh-pages branch.
      #
      # Uses the official Allure CLI directly (npm install, same tool this repo already uses
      # locally) rather than simple-elf/allure-report-action -- confirmed directly that
      # action's Docker image is broken: its Dockerfile FROMs openjdk:8-jre-alpine, which
      # Docker Hub has removed from the official library/openjdk namespace, so the image
      # build fails before the job's real steps ever run (GitHub pre-builds every
      # Docker-based action in a job up front, so one broken container action blocks
      # everything else in the job, not just its own step).
      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results --clean -o allure-report

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Allure results + screenshots + heal data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            target/screenshots/
            target/page-source/
            self-healing-data/
            heal-summary.txt
          retention-days: 14

      # --- Reporting addition 4: Slack failure notification ---------------------------
      # Only fires on failure, and only if the webhook secret is actually configured --
      # same "no-op without a key" honesty as AiNarrator. Silent when the secret is unset,
      # never a broken step.
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Mobile Automation device suite FAILED on `${{ github.ref_name }}` (heal rate: ${{ steps.heal-gate.outputs.heal_rate }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }