# Committed defaults. Nothing machine-specific and nothing secret belongs here --
# put that in config-local.properties (git-ignored), an env var, or -D on the command line.
# See ConfigManager for the full precedence order.

# --- Appium server ------------------------------------------------------------
# Appium 3 dropped the /wd/hub path. Point at the bare server URL.
appium.server.url=http://127.0.0.1:4723

# --- App under test -----------------------------------------------------------
# Verified by parsing the APK's binary AndroidManifest.xml.
app.package=com.titanstudio.pro
app.activity=com.titanstudio.pro.MainActivity
# app.path is a local filesystem path, so it is deliberately NOT committed.
# Set it in config-local.properties, or: -Dapp.path=C:/path/to/base.apk

# --- Session behaviour --------------------------------------------------------
appium.noReset=false
appium.fullReset=false
appium.newCommandTimeoutSec=120
appium.autoGrantPermissions=true

# --- Device selection ---------------------------------------------------------
# Names an entry in device-profiles.json. BaseTest scopes this PER THREAD, so a
# parallel run can drive several profiles at once from one JVM.
device.profile=default

# --- Waits & reliability ------------------------------------------------------
# No Thread.sleep exists anywhere in this framework; every wait is explicit and
# bounded by these values.
wait.timeoutSeconds=20
wait.pollIntervalMillis=250
# Flutter renders a bare native splash before its engine attaches. Page source
# captured before that point looks like an app with no accessibility tree at all,
# which is why first-frame detection gets its own, longer budget.
wait.appReadyTimeoutSeconds=60
test.retryCount=1

# --- Self-healing -------------------------------------------------------------
# The engine is fully deterministic: no model is called at runtime, ever.
selfhealing.enabled=true
selfhealing.candidateTimeoutMillis=2000
selfhealing.cascadeTimeoutMillis=5000
# A cascade match below this score is rejected rather than risked. Healing onto the
# wrong element is worse than failing, because it produces a green run that proves nothing.
selfhealing.minConfidence=0.62
selfhealing.ledgerPath=self-healing-data/heal-events.jsonl

# --- Interference guard -------------------------------------------------------
# com.titanstudio.pro ships Google Mobile Ads and Play Core. Both can put an activity
# in front of the app mid-test. The guard dismisses them and RECORDS the interruption --
# an ad that fires on every run is a finding, not noise to be swallowed.
guard.enabled=true
guard.interruptingActivities=com.google.android.gms.ads.AdActivity,\
  com.google.android.gms.ads.NotificationHandlerActivity,\
  com.google.android.play.core.common.PlayCoreDialogWrapperActivity

# --- Device pool (per-thread ports) --------------------------------------------
# DevicePool derives systemPort/mjpegServerPort/chromedriverPort from these bases plus a
# thread-assigned slot index, so a new device profile never needs (and never risks
# hand-picking) its own port. Only change these if the default ranges collide with
# something else already running on this machine.
devicepool.systemPort.base=8200
devicepool.mjpegPort.base=7810
devicepool.chromedriverPort.base=9515

# --- Heal policy ----------------------------------------------------------------
# Read by `mvn exec:java -Dexec.args="analyze"`. A heal recovering an occasional stale
# locator is normal; a run where a large share of tests needed healing is a real UI-change
# signal, not incidental drift, and should not read as a clean green.
healpolicy.warnHealRate=0.05
healpolicy.maxHealRate=0.15
